spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mental_health_db
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
      password: CHANGE_ME_REDIS_PASSWORD
  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: ''
    password: ''
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8081

app:
  jwt:
    secret: dev-secret-key-minimum-32-characters-long-for-local
    access-token-expiry: 900000
    refresh-token-expiry: 604800000
    issuer: cimhans-dev
  encryption:
    secret-key: DevEncryptKey123
  frontend-url: http://localhost:5173

logging:
  level:
    com.cimhans: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
