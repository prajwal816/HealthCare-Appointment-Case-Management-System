spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-on-validation-error: false

logging:
  level:
    com.cimhans: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

app:
  jwt:
    secret: DevSecretKeyForLocalDevelopmentOnlyNotForProduction123456789!
  encryption:
    secret-key: DevAESKey1234567
    salt: DevSalt12345678!
